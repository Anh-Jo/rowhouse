name: E2E Front

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  e2e-front:
    name: Playwright E2E
    if: contains(github.event.pull_request.labels.*.name, 'e2e front')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 4020:1025
          - 4021:8025

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_auth
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789-abcdef
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:4173
      SMTP_HOST: localhost
      SMTP_PORT: 4020
      SMTP_SECURE: false
      MAIL_FROM: noreply@rowhouse.local
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: pnpm --filter backend run database:generate

      # The postgres service only creates the app database; the auth database
      # lives in the same instance and must exist before its migrations run.
      - name: Create auth database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c "CREATE DATABASE ci_auth OWNER ci;"

      - name: Run database migrations (app + auth)
        run: pnpm --filter backend run database:migrate

      - name: Seed database
        run: cd apps/backend && npx ts-node prisma/seed.ts

      - name: Generate OpenAPI spec (includes nest build)
        run: pnpm --filter backend run contracts:export

      - name: Generate frontend API types
        run: pnpm --filter webapp run api:generate

      - name: Build frontend
        run: pnpm --filter webapp run build

      - name: Start backend
        run: |
          cd apps/backend
          node dist/src/main.js &
        env:
          PORT: 3000

      - name: Start frontend preview
        run: pnpm --filter webapp run preview --port 4173 &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:4173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:4173

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
