name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Codegen, Types, Lint & Tests
    runs-on: ubuntu-latest

    # No database service here on purpose: contracts:export creates the Nest
    # app without init(), so nothing connects at codegen time — the auth module
    # reads env vars when the module loads but only opens connections on first
    # query. The day a module truly connects at bootstrap (GraphQL schema
    # build…), add a postgres service.
    #
    # If you start committing openapi.json (a client that builds without a
    # runnable backend — e.g. a mobile CI build), also add a drift check after
    # `pnpm verify`:  git diff --exit-code -- apps/backend/openapi.json

    # EnvSchema is validated when contracts:export boots the AppModule, so every
    # required var must be present and well-formed — values are placeholders,
    # nothing is contacted (same convention as backend-e2e.yml).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_auth
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789-abcdef
      CREDENTIALS_KEK: cm93aG91c2UtdGVzdC1rZWstMTIzNDU2Nzg5YWJjZCE=
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates both clients (app + auth). `generate` never connects — the
      # job-level placeholder URLs are enough.
      - name: Generate Prisma clients
        run: pnpm --filter backend run database:generate

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # codegen re-exports the OpenAPI spec and regenerates the frontend API
      # types before typechecking — a drifting contract fails the gate here.
      # knip then fails on dead files, unused exports and unused dependencies.
      - name: Verify (codegen + check-types + lint + tests + knip)
        run: pnpm verify
